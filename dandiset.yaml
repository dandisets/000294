dateCreated: '2022-07-15T11:27:46.490921+00:00'
description: "This dataset contains simultaneous intracellular whole-cell patch clamp
  and extracellular high-density microelectrode array (HD-MEA) recordings.\nIt includes
  data from two files, corresponding to two recorded neurons. Each NWB file contains
  several runs of 8 eCode protocols, with syncronized intracellular voltages, stimulus
  currents, and extracellular voltages."
